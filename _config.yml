# Basic site settings
locale: "en-US"
site_theme: "default"
title: "Chaofan Zhang"
title_separator: "-"
name: &name "Chaofan Zhang"
description: &description "Academic homepage of Chaofan Zhang — visuotactile sensing, tactile simulation, dexterous manipulation, and tactile foundation models."

# Set these three fields before publishing to GitHub Pages.
url: "https://Zhang-Chaofan.github.io"
baseurl: ""
repository: "Zhang-Chaofan/Zhang-Chaofan.github.io"

author:
  avatar: "profile.png"
  name: "Chaofan Zhang | 张超凡"
  bio: "Assistant Professor, CASIA"
  location: "Beijing, China"
  employer: "Institute of Automation, Chinese Academy of Sciences"
  email: "chaofan.zhang@ia.ac.cn"
  googlescholar: https://scholar.google.com/citations?user=rshgKPoAAAAJ&hl=zh-CN


teaser: "research-manipulation.png"
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
comments:
  provider:

atom_feed:
  hide: true

analytics:
  provider: "false"

include:
  - _pages
  - files

exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - AGENTS.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docker-compose.yaml
  - node_modules
  - package.json
  - source_material
  - tmp
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
